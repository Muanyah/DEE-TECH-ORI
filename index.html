<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glowing Button</title>
  <style>
    :root {
      --bg: #0b0a1f;
      --glow: #8b5cff;
      --glow-2: #ff3fa4;
      --text: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 50%, #17123a 0%, var(--bg) 70%);
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    }

    .glow-button {
      position: relative;
      padding: 1.1rem 3.2rem;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--text);
      background: #14112e;
      border: 2px solid var(--glow);
      border-radius: 999px;
      cursor: pointer;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
      box-shadow:
        0 0 12px var(--glow),
        0 0 32px rgba(139, 92, 255, 0.6),
        inset 0 0 16px rgba(139, 92, 255, 0.45);
      animation: pulse 2.4s ease-in-out infinite;
      transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease;
    }

    /* Soft halo behind the button */
    .glow-button::before {
      content: "";
      position: absolute;
      inset: -14px;
      z-index: -1;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--glow), var(--glow-2));
      filter: blur(26px);
      opacity: 0.55;
      transition: opacity 0.2s ease;
    }

    .glow-button:hover {
      background: #1d1844;
      border-color: var(--glow-2);
      transform: scale(1.05);
    }

    .glow-button:hover::before { opacity: 0.9; }

    .glow-button:active { transform: scale(0.97); }

    .glow-button:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 6px;
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow:
          0 0 12px var(--glow),
          0 0 32px rgba(139, 92, 255, 0.6),
          inset 0 0 16px rgba(139, 92, 255, 0.45);
      }
      50% {
        box-shadow:
          0 0 20px var(--glow),
          0 0 56px rgba(139, 92, 255, 0.9),
          inset 0 0 24px rgba(139, 92, 255, 0.7);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .glow-button { animation: none; }
    }
  </style>
</head>
<body>

  <button class="glow-button" id="glowBtn">CLICK ME</button>

  <script>
    // ▼ Change this to wherever you want the button to lead ▼
    const DESTINATION = "home.html";   // e.g. "about.html" or a full URL

    document.getElementById("glowBtn").addEventListener("click", function () {
      window.location.href = DESTINATION;

      // To open in a new tab instead, use this line:
      // window.open(DESTINATION, "_blank");
    });
  </script>

</body>
</html>
