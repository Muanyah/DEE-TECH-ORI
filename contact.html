<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Dee-TECH</title>
<meta name="description" content="Dee-TECH: independent creative and technology studio.">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="">
<a href="#main" style="position:absolute;left:-999px" onfocus="this.style.left='8px'" onblur="this.style.left='-999px'">Skip to content</a>
<div class="frame">
<header class="hd" id="hd"></header>
<main id="main" class="sec"><h1>Contact</h1>
<p class="note">Fill in the form and tap the button. WhatsApp opens with your message ready to send to us. Nothing is delivered until you press Send in WhatsApp.</p><br>
<form id="cf" novalidate>
<div><label for="name">Your name</label><input id="name" name="name" autocomplete="name" maxlength="100" aria-describedby="name-err"><p class="err" id="name-err" role="alert"></p></div>
<div><label for="whatsapp">Your WhatsApp number (with country code)</label><input id="whatsapp" name="whatsapp" type="tel" inputmode="tel" autocomplete="tel" placeholder="+234 801 234 5678" maxlength="25" aria-describedby="whatsapp-err"><p class="err" id="whatsapp-err" role="alert"></p></div>
<div><label for="type">Project type</label><select id="type" name="type" aria-describedby="type-err"><option value="">Choose one</option></select><p class="err" id="type-err" role="alert"></p></div>
<div><label for="message">Message</label><textarea id="message" name="message" rows="6" maxlength="2000" aria-describedby="message-err"></textarea><p class="err" id="message-err" role="alert"></p></div>
<button class="pill" type="submit">Chat on WhatsApp</button></form>
<div id="status" role="status" aria-live="polite"></div></main>
<footer id="ft"></footer>
</div>
<noscript><p style="padding:16px;position:relative">JavaScript is needed for navigation and content on this demo site.</p></noscript>
<script src="js/content.js"></script>
<script src="js/main.js"></script>
</body>
</html>
